# SAC Agent Configuration
# Override with: python rl_search/train.py agent=sac

type: sac

config:
  learning_rate: 3.0e-4
  buffer_size: 100000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  target_entropy: auto
  use_custom_feature_extractor: true
  features_dim: 512
  use_image: false
