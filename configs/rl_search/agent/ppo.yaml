# PPO Agent Configuration
# Override with: python rl_search/train.py agent=ppo

type: ppo

config:
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_custom_feature_extractor: true
  features_dim: 512
  use_image: false
